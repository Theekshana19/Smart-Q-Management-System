<div class="page">
  <h1>Counter Management</h1>
  <div class="counter-grid">
    @for (c of counters(); track c['id']) {
      <div class="counter-card card">
        <h3>{{ c['counterName'] }}</h3>
        <span class="status">{{ c['status'] }}</span>
        <p>Staff: {{ c['assignedStaff'] ?? 'Unassigned' }}</p>
        <ul>
          @for (svc of $any(c['assignedServices']); track svc) {
            <li>{{ svc }}</li>
          }
        </ul>
      </div>
    }
    <div class="counter-card card add">+ Add New Counter</div>
  </div>
</div>
