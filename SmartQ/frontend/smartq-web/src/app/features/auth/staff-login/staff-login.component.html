<div class="login-page">
  <div class="login-card">
    <div class="brand">
      <h1>SmartQ</h1>
      <p>Staff Console</p>
    </div>
    <div class="badge"><span class="dot"></span> System Online</div>

    <div class="error" *ngIf="error()">{{ error() }}</div>

    <form (ngSubmit)="submit()">
      <label>
        <span>Username</span>
        <input type="text" [(ngModel)]="username" name="username" autocomplete="username" required />
      </label>
      <label>
        <span>Password</span>
        <input type="password" [(ngModel)]="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in...' : 'Login' }}
      </button>
    </form>
  </div>
</div>
